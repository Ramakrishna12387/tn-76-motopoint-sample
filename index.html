<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_TN76 Motopoint | Surandai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animated Background */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #000000, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glowing Text Animation */
        .glowing-text {
            font-weight: 800;
            background: linear-gradient(to right, #ff7e5f, #feb47b, #ff7e5f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            background-size: 200% auto;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Views */
        .view-section { display: none; }
        .active-view { display: block; }
        
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="p-4 bg-black/50 backdrop-blur sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showView('home-view')">
                <!-- Replace src with Instagram Logo URL -->
                <img src="https://ui-avatars.com/api/?name=TN76&background=ff7e5f&color=fff&rounded=true" alt="Logo" class="w-10 h-10 rounded-full border-2 border-orange-500">
                <span class="text-xl font-bold tracking-wider">TN76 <span class="text-orange-500">Motopoint</span></span>
            </div>
            <div>
                <button onclick="showView('home-view')" class="mr-4 hover:text-orange-500 transition">Shop</button>
                <button onclick="checkAdminAccess()" class="bg-orange-600 px-4 py-2 rounded-md hover:bg-orange-700 transition"><i class="fas fa-lock mr-2"></i>Admin</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-4">
        
        <!-- HOME VIEW -->
        <section id="home-view" class="view-section active-view">
            <!-- Hero -->
            <div class="text-center py-16">
                <h1 class="text-4xl md:text-6xl mb-4 glowing-text">Welcome to _TN76 Motopoint</h1>
                <p class="text-gray-300 text-lg mb-8">Premium Bike Accessories & Modifications in Surandai</p>
                <div class="w-32 h-1 bg-orange-500 mx-auto rounded"></div>
            </div>

            <!-- Products Grid -->
            <div class="mb-8 flex justify-between items-end">
                <h2 class="text-2xl font-bold border-l-4 border-orange-500 pl-3">Our Products</h2>
            </div>
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-16">
                <!-- Products will load here dynamically -->
            </div>

            <!-- Shop Location -->
            <div class="mt-12 bg-black/30 p-6 rounded-xl border border-gray-800">
                <h2 class="text-2xl font-bold mb-4 text-orange-500"><i class="fas fa-map-marker-alt mr-2"></i>Visit Our Shop</h2>
                <div class="w-full h-64 rounded-lg overflow-hidden">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3936.197992981997!2d77.3995!3d9.0068!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zOcKwMDAnMjQuNSJOIDc3wrAyMyw1OC4yIkU!5e0!3m2!1sen!2sin!4v1690000000000!5m2!1sen!2sin" 
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                    </iframe>
                </div>
            </div>
        </section>

        <!-- ADMIN LOGIN VIEW -->
        <section id="admin-login-view" class="view-section">
            <div class="max-w-md mx-auto mt-20 bg-gray-900 p-8 rounded-xl border border-gray-800 shadow-2xl">
                <h2 class="text-2xl font-bold text-center mb-6">Admin Portal</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-400 mb-1">Username</label>
                        <input type="text" id="login-username" class="w-full p-3 rounded bg-black border border-gray-700 focus:border-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">Password</label>
                        <input type="password" id="login-password" class="w-full p-3 rounded bg-black border border-gray-700 focus:border-orange-500 outline-none">
                    </div>
                    <button onclick="login()" class="w-full bg-orange-600 p-3 rounded font-bold hover:bg-orange-700 transition mt-4">Login</button>
                    <p id="login-error" class="text-red-500 text-sm text-center hidden mt-2">Invalid username or password!</p>
                </div>
            </div>
        </section>

        <!-- ADMIN DASHBOARD VIEW -->
        <section id="admin-dashboard-view" class="view-section">
            <div class="flex justify-between items-center mt-8 mb-8">
                <h2 class="text-3xl font-bold"><i class="fas fa-cog text-orange-500 mr-2"></i>Dashboard</h2>
                <button onclick="logout()" class="text-red-400 hover:text-red-500"><i class="fas fa-sign-out-alt mr-2"></i>Logout</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Add Product Form -->
                <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 h-fit">
                    <h3 class="text-xl font-bold mb-4">Add New Product</h3>
                    <div class="space-y-4">
                        <input type="text" id="p-name" placeholder="Product Name (e.g. HJG Fog Light)" class="w-full p-3 rounded bg-black border border-gray-700 text-white">
                        <input type="number" id="p-price" placeholder="Price (₹)" class="w-full p-3 rounded bg-black border border-gray-700 text-white">
                        <input type="text" id="p-image" placeholder="Image URL" class="w-full p-3 rounded bg-black border border-gray-700 text-white">
                        <button onclick="addProduct()" class="w-full bg-green-600 p-3 rounded font-bold hover:bg-green-700">Add Product</button>
                    </div>
                </div>

                <!-- Manage Products -->
                <div class="lg:col-span-2 bg-gray-900 p-6 rounded-xl border border-gray-800">
                    <h3 class="text-xl font-bold mb-4">Manage Inventory</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b border-gray-700">
                                    <th class="p-3">Product Name</th>
                                    <th class="p-3">Price</th>
                                    <th class="p-3">Action</th>
                                </tr>
                            </thead>
                            <tbody id="admin-product-list">
                                <!-- Dynamic List -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center p-6 border-t border-gray-800 mt-12 text-gray-500">
        <p>&copy; 2026 TN76 Motopoint Surandai. All rights reserved.</p>
    </footer>

    <script>
        // ==========================================
        // 1. ADMIN CREDENTIALS (CHANGE THESE)
        // ==========================================
        const ADMIN_USERNAME = "tn76motopoint";
        const ADMIN_PASSWORD = "pointshop";
        const WHATSAPP_NUMBER = "919585023258"; // Shop owner's number with country code

        // ==========================================
        // 2. STATE MANAGEMENT (LOCAL STORAGE)
        // ==========================================
        let products = JSON.parse(localStorage.getItem('tn76_products')) || [
            { id: 1, name: "HJG Mini Drive Fog Light", price: 1200, image: "https://images.unsplash.com/photo-1557008075-7f2c5efa4cfd?auto=format&fit=crop&q=80&w=400" },
            { id: 2, name: "Axor Apex Helmet", price: 4999, image: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&q=80&w=400" }
        ];

        // ==========================================
        // 3. UI NAVIGATION
        // ==========================================
        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            if(viewId === 'home-view') renderHomeProducts();
            if(viewId === 'admin-dashboard-view') renderAdminProducts();
        }

        // ==========================================
        // 4. AUTHENTICATION
        // ==========================================
        function checkAdminAccess() {
            if(sessionStorage.getItem('tn76_admin_logged_in') === 'true') {
                showView('admin-dashboard-view');
            } else {
                showView('admin-login-view');
            }
        }

        function login() {
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            
            if(u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
                sessionStorage.setItem('tn76_admin_logged_in', 'true');
                document.getElementById('login-error').classList.add('hidden');
                document.getElementById('login-username').value = '';
                document.getElementById('login-password').value = '';
                showView('admin-dashboard-view');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            sessionStorage.removeItem('tn76_admin_logged_in');
            showView('home-view');
        }

        // ==========================================
        // 5. PRODUCT MANAGEMENT
        // ==========================================
        function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const image = document.getElementById('p-image').value || "https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=400";

            if(!name || !price) {
                alert("Please enter product name and price!");
                return;
            }

            const newProduct = {
                id: Date.now(),
                name: name,
                price: parseInt(price),
                image: image
            };

            products.push(newProduct);
            localStorage.setItem('tn76_products', JSON.stringify(products));
            
            // Clear inputs
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-image').value = '';
            
            renderAdminProducts();
        }

        function deleteProduct(id) {
            if(confirm("Are you sure you want to delete this?")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('tn76_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        // ==========================================
        // 6. RENDERING
        // ==========================================
        function renderHomeProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            if(products.length === 0) {
                grid.innerHTML = '<p class="text-gray-400">Products updating soon...</p>';
                return;
            }

            products.forEach(p => {
                const msg = encodeURIComponent(`Hi TN76 Motopoint, I want to enquire about ${p.name} (Price: ₹${p.price})`);
                const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;

                grid.innerHTML += `
                    <div class="product-card rounded-xl overflow-hidden shadow-lg flex flex-col">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-xl mb-2">${p.name}</h3>
                                <p class="text-orange-400 font-bold text-lg mb-4">₹${p.price}</p>
                            </div>
                            <a href="${waLink}" target="_blank" class="block w-full bg-green-600 hover:bg-green-700 text-center py-2 rounded-lg font-semibold transition">
                                <i class="fab fa-whatsapp mr-2"></i>Enquire
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function renderAdminProducts() {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <tr class="border-b border-gray-800 hover:bg-gray-800/50">
                        <td class="p-3">${p.name}</td>
                        <td class="p-3 text-orange-400">₹${p.price}</td>
                        <td class="p-3">
                            <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-400"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // Initialize App
        renderHomeProducts();
    </script>
</body>
</html>
